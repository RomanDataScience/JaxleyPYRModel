# The model, morphology, mechanisms, protocol, and segmented-trace settings
# come from the existing validated Jaxley configuration.
base_config: ../../Jaxley_refactored/configs/LSU_1_cma_adam.yaml
output_root: ../runs

multi_objective:
  sampler: mocma
  seed: 1234
  population_size: 40
  trials: 12000
  study_name: mocma_depolarizing_fidelity_100_200_train24
  parallel_workers: 8
  plot_completed_trials: true
  # Persistent SQLite storage enables trial-level resume/checkpointing.
  storage: auto
  resume: true
  heartbeat_interval_s: 60
  grace_period_s: 300
  cell_id: m20240527cd
  morphology_d_lambda: 0.3
  # This run loads and simulates depolarizing traces only.
  protocols: [depolarizing_step]
  trace_selection:
    # Trace numbers are counted independently within each protocol.
    optimization_indices: [2, 4]
    test_indices: [1, 3]
  # This run only scores and plots the optimization traces.
  evaluate_test: false

  fitness_windows:
    # These windows are used by the time-course objective. Feature detectors
    # continue to use their own physiological event windows.
    depolarizing:
      pre_ms: 100.0
      post_ms: 200.0
    hyperpolarizing:
      pre_ms: 200.0
      post_ms: 200.0

  feature_detection:
    threshold_mV: -20.0
    refractory_ms: 2.0
    smoothing_ms: 0.2
    baseline_window_ms: 30.0
    fahp_search_ms: 20.0
    post_step_analysis_ms: 700.0
    hyper_peak_window_ms: 20.0
    hyper_steady_state_fraction: 0.20

  objectives:
    mode: depolarizing_fidelity
    invalid_feature_penalty: 1000000.0
    spike_violation_loss: 100000.0
    ap_count_tolerance: 0.0
    ap_count_violation_loss: 100000.0
    # Four times stronger than the default one-AP error in MOCMA's
    # hypervolume-based elite selection. Pareto dominance remains unchanged.
    scales:
      ap_count: 0.25
    overlap_sigma_mV: 3.0
    spike_event_window_ms: 3.0
    spike_event_weight: 4.0
    trajectory_huber_delta_mV: 3.0
    spike_timing_scale_ms: 2.0
    spike_count_scale: 1.0
    overlap_window_weights:
      baseline: 1.0
      stimulus: 1.0
      recovery: 1.0
      first_100ms_spiking: 2.0
    tie_tolerance: 1.0e-12
