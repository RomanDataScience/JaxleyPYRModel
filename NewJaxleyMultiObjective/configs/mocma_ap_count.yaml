# CMA-ES search with one objective: match the number of APs on each
# depolarizing training trace. Voltage shape and recovery are reported only.
base_config: ../../Jaxley_refactored/configs/LSU_1_cma_adam.yaml
output_root: ../runs

multi_objective:
  sampler: cma_es
  seed: 1234
  population_size: 40
  trials: 12000
  study_name: cma_es_ap_count
  parallel_workers: 1
  plot_completed_trials: true
  storage: auto
  resume: true
  heartbeat_interval_s: 60
  grace_period_s: 300

  cell_id: m20240527cd
  morphology_d_lambda: 0.1
  protocols: [depolarizing_step]
  trace_selection:
    optimization_indices: [2, 4]
    test_indices: [1, 3]
  evaluate_test: false

  fitness_windows:
    depolarizing:
      pre_ms: 100.0
      post_ms: 500.0
    hyperpolarizing:
      pre_ms: 200.0
      post_ms: 200.0

  feature_detection:
    threshold_mV: -20.0
    refractory_ms: 2.0
    smoothing_ms: 0.2
    baseline_window_ms: 30.0
    fahp_search_ms: 20.0
    post_step_analysis_ms: 500.0
    hyper_peak_window_ms: 20.0
    hyper_steady_state_fraction: 0.20

  objectives:
    mode: ap_count_only
    features: [ap_count]
    invalid_feature_penalty: 1000000.0
    # Kept for the outside-stimulus spike guard. In-step count differences are
    # graded by the sole ap_count objective rather than hard-rejected.
    spike_violation_loss: 100000.0
    ap_count_tolerance: 0.0
    ap_count_violation_loss: 100000.0
    scales:
      ap_count: 1.0
