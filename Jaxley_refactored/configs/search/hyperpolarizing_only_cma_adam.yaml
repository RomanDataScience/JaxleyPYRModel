extends: ../losses/hyperpolarizing_only.yaml

# Full CMA-ES -> exploratory Adam -> backtracking Adam protocol, using only
# hyperpolarizing traces and their voltage plus first-derivative MSE.
fit:
  initialization:
    mode: jittered_reference
    scale: 0.10
    preserve_exact_zero_reference: true

search:
  strategy: hybrid
  global:
    algorithm: cma_es
    # Empty means all 44 fitted conductance, passive, and kinetic parameters.
    parameter_names: []
    population_size: 40
    # Recombine the 12 best candidates (30% of 40) in each generation.
    parent_fraction: 0.30
    generations: 100
    sigma0: 0.15
    boundary_policy: resample
    invalid_loss: 1.0e12
    checkpoint_every_generations: 1

  local_exploration:
    optimizer: adam
    epochs: 50
    learning_rate: 0.005
    gradient_clip_norm: 10.0
    line_search:
      enabled: false

  local_refinement:
    optimizer: adam
    epochs: 150
    learning_rate: 0.001
    gradient_clip_norm: 10.0
    line_search:
      enabled: true

  selection:
    global_rank_by: training_loss
    local_rank_by: training_loss
    final_rank_by: validation_primary_endpoint
    keep_after_global: 10
    keep_after_exploration: 10

  reporting:
    cma_plot_every_generations: 1
    adam_plot_every_epochs: 10
    plot_final_candidates: true

output:
  # Inherited root is Jaxley_refactored/runs_hyper.
  run_name: auto
