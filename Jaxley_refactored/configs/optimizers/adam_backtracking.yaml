extends: ../runtimes/cpu_dt_0p1.yaml

# Adam determines the direction. Backtracking tests the largest candidate
# learning rate first and shrinks it until the objective over all eight traces
# is strictly lower. One accepted candidate updates the shared parameter vector.
fit:
  optimizer:
    name: adam
    learning_rate: 0.02
    gradient_clip_norm: 10.0
    epochs: 50
    line_search:
      enabled: true
      reduction_factor: 0.5
      growth_factor: 1.2
      minimum_learning_rate: 0.001
      maximum_learning_rate: 0.1
      maximum_trials: 3
      require_loss_decrease: true

output:
  run_name: auto
