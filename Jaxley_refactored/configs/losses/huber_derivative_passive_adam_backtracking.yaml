extends: ../optimizers/adam_backtracking.yaml

fit:
  objective:
    components:
      - kind: pseudo_huber
        label: waveform_huber
        weight: 1.0
        window: score
        scale_mV: 5.0
        delta: 1.0

      - kind: derivative_mse
        label: waveform_derivative
        weight: 0.2
        window: stimulus
        scale_mV_per_ms: 10.0

      - kind: resting_voltage_error
        label: resting_voltage
        weight: 0.1
        window: baseline
        scale_mV: 5.0

      - kind: steady_state_error
        label: hyperpolarizing_steady_state
        weight: 0.25
        protocols: [hyperpolarizing_pulse]
        window: stimulus_end
        scale_mV: 5.0

output:
  run_name: auto
