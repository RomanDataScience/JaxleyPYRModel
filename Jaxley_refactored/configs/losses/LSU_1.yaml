extends: ../optimizers/adam_backtracking.yaml

# Simulate depolarizing records through 500 ms after stimulus offset. The
# hyperpolarizing offset is at trace-local 550 ms, so its 150-ms override ends
# both selected hyperpolarizing records at 700 ms.
dataset:
  simulation_window:
    post_stimulus_ms: 500.0
    post_stimulus_ms_by_protocol:
      hyperpolarizing_pulse: 150.0
  score_windows:
    post_ms: 500.0

# LSU_1 makes depolarizing firing rate and DBLO the two primary targets while
# retaining secondary full-trace, plateau, spike-shape, recovery, AHP, and
# hyperpolarizing constraints. Every term is continuous in simulated voltage.
fit:
  objective:
    # Preserve the global 0.7/0.3 protocol allocation for protocol-specific
    # components instead of converting each component to a conditional mean.
    renormalize_protocol_filtered_components: false

    penalties:
      # Count smooth upward crossings whose destination sample lies before
      # stimulus onset or after stimulus offset. Across all selected traces,
      # N outside spikes multiply the complete LSU_1 loss by 1.1**N.
      - kind: soft_outside_stimulus_spike_multiplier
        label: outside_step_spikes
        factor_per_spike: 1.1
        maximum_multiplier: 1.0e12
        protocols: [depolarizing_step, hyperpolarizing_pulse]
        threshold_mV: -20.0
        temperature_mV: 2.0

    components:
      # Hyperpolarizing pulse: the full score window retains both pulse decay
      # and post-pulse repolarization. Its raw weight compensates for the 0.3
      # protocol allocation, giving about 0.35 influence at one scale of error.
      - kind: voltage_mse
        label: hyperpolarizing_waveform_mse
        weight: 1.17
        protocols: [depolarizing_step, hyperpolarizing_pulse]
        window: score
        scale_mV: 5.0

      # Primary target 1: depolarizing firing frequency. The one-scale effective
      # weight is 0.7 * 4.0 = 2.8, about eight times any secondary feature
      # group below.
      - kind: soft_firing_rate_error
        label: depolarizing_firing_rate
        weight: 4.0
        protocols: [depolarizing_step]
        window: stimulus
        threshold_mV: -20.0
        temperature_mV: 2.0
        scale_hz: 5.0

      # Direct pointwise difference over the complete scored depolarizing
      # trace, including baseline, stimulus, and post-step recovery. This stays
      # secondary because MSE is deliberately sensitive to spike timing.
      - kind: voltage_mse
        label: depolarizing_waveform_mse
        weight: 0.5
        protocols: [depolarizing_step]
        window: score
        scale_mV: 5.0

      # Broad inter-spike plateau mean, excluding experimental spike samples.
      # This remains a secondary complement to the primary DBLO target.
      - kind: subthreshold_mean_error
        label: depolarizing_voltage_plateau
        weight: 0.15
        protocols: [depolarizing_step]
        window: stimulus
        threshold_mV: -20.0
        scale_mV: 5.0

      # Paper-defined depolarization baseline offset (DBLO): mean smooth
      # minimum from each observed spike peak to the next observed threshold,
      # minus the pre-step resting voltage. The recordings are already
      # liquid-junction-potential corrected. Fixed experimental intervals make
      # the term continuous in simulated voltage. Its one-scale effective
      # weight is 0.7 * 4.0 = 2.8, about eight times any secondary feature
      # group.
      - kind: soft_dblo_error
        label: depolarizing_dblo
        weight: 4.0
        protocols: [depolarizing_step]
        window: stimulus
        threshold_mV: -20.0
        temperature_mV: 1.0
        scale_mV: 5.0

      # Spike waveform and slope.
      - kind: pseudo_huber
        label: depolarizing_spike_waveform
        weight: 0.13
        protocols: [depolarizing_step]
        window: stimulus
        scale_mV: 5.0
        delta: 1.0

      - kind: derivative_mse
        label: depolarizing_spike_derivative
        weight: 0.13
        protocols: [depolarizing_step]
        window: stimulus
        scale_mV_per_ms: 20.0

      # Smooth peak-voltage matching emphasizes action-potential height.
      - kind: soft_maximum_voltage_error
        label: depolarizing_spike_height
        weight: 0.32
        protocols: [depolarizing_step]
        window: stimulus
        temperature_mV: 1.0
        scale_mV: 5.0

      # Full post-step trajectory and its slow slope back toward baseline.
      # These weights keep recovery as a strong secondary target beneath the
      # primary firing-rate and DBLO terms.
      - kind: pseudo_huber
        label: depolarizing_recovery_waveform
        weight: 0.5
        protocols: [depolarizing_step]
        window: recovery
        scale_mV: 3.0
        delta: 1.0

      - kind: derivative_mse
        label: depolarizing_recovery_derivative
        weight: 0.2
        protocols: [depolarizing_step]
        window: recovery
        scale_mV_per_ms: 1.0

      # Smooth recovery minimum captures after-hyperpolarization depth.
      - kind: soft_minimum_voltage_error
        label: depolarizing_ahp_depth
        weight: 0.10
        protocols: [depolarizing_step]
        window: recovery
        temperature_mV: 1.0
        scale_mV: 3.0

    aggregation: protocol_mean
    # With two training traces per protocol, these protocol totals assign 0.35
    # to each depolarizing trace and 0.15 to each hyperpolarizing trace.
    protocol_weights:
      depolarizing_step: 0.7
      hyperpolarizing_pulse: 0.3

output:
  run_name: auto
