extends: ../optimizers/adam_backtracking.yaml
# Detailed reference: configs/losses/README_LSU_1.md

# Simulate depolarizing records through 500 ms after stimulus offset. The
# hyperpolarizing offset is at trace-local 550 ms, so its 100-ms override ends
# both selected hyperpolarizing records at 650 ms.
dataset:
  simulation_window:
    post_stimulus_ms: 500.0
    post_stimulus_ms_by_protocol:
      hyperpolarizing_pulse: 100.0
  score_windows:
    post_ms: 500.0

# LSU_1 uses pointwise MSE only for hyperpolarizing traces. Depolarizing traces
# use differentiable firing-rate, DBLO, spike-shape/height, and recovery terms.
fit:
  objective:
    # Preserve the global 0.8/0.2 protocol allocation for protocol-specific
    # components instead of converting each component to a conditional mean.
    renormalize_protocol_filtered_components: false

    penalties:
      # Count smooth upward crossings whose destination sample lies before
      # stimulus onset or after stimulus offset. Across all selected traces,
      # N outside spikes multiply the complete LSU_1 loss by 1.1**N.
      - kind: soft_outside_stimulus_spike_multiplier
        label: outside_step_spikes
        factor_per_spike: 1.1
        maximum_multiplier: 1.0e12
        protocols: [depolarizing_step, hyperpolarizing_pulse]
        threshold_mV: -20.0
        temperature_mV: 2.0

    components:
      # Point-by-point voltage difference only for hyperpolarizing traces.
      - kind: voltage_mse
        label: hyperpolarizing_waveform_mse
        weight: 1.0
        protocols: [hyperpolarizing_pulse]
        window: score
        scale_mV: 5.0

      # Smooth firing-frequency comparison during the depolarizing current step.
      - kind: soft_firing_rate_error
        label: depolarizing_firing_rate
        weight: 4.0
        protocols: [depolarizing_step]
        window: stimulus
        threshold_mV: -20.0
        temperature_mV: 2.0
        scale_hz: 5.0

      # Inter-spike depolarization baseline offset relative to resting voltage.
      - kind: soft_dblo_error
        label: depolarizing_dblo
        weight: 2.0
        protocols: [depolarizing_step]
        window: stimulus
        threshold_mV: -20.0
        temperature_mV: 1.0
        scale_mV: 5.0

      # Robust voltage-shape and slope comparisons during the current step.
      - kind: pseudo_huber
        label: depolarizing_spike_waveform
        weight: 0.25
        protocols: [depolarizing_step]
        window: stimulus
        scale_mV: 5.0
        delta: 1.0

      - kind: derivative_mse
        label: depolarizing_spike_derivative
        weight: 0.25
        protocols: [depolarizing_step]
        window: stimulus
        scale_mV_per_ms: 20.0

      # Smooth maximum-voltage comparison for action-potential height.
      - kind: soft_maximum_voltage_error
        label: depolarizing_spike_height
        weight: 0.32
        protocols: [depolarizing_step]
        window: stimulus
        temperature_mV: 1.0
        scale_mV: 5.0

      # Post-step waveform, return slope, and AHP depth.
      - kind: pseudo_huber
        label: depolarizing_recovery_waveform
        weight: 0.5
        protocols: [depolarizing_step]
        window: recovery
        scale_mV: 3.0
        delta: 1.0

      - kind: derivative_mse
        label: depolarizing_recovery_derivative
        weight: 0.2
        protocols: [depolarizing_step]
        window: recovery
        scale_mV_per_ms: 1.0

      - kind: soft_minimum_voltage_error
        label: depolarizing_ahp_depth
        weight: 0.10
        protocols: [depolarizing_step]
        window: recovery
        temperature_mV: 1.0
        scale_mV: 3.0

    aggregation: protocol_mean
    # With two training traces per protocol, these totals assign 0.4 to each
    # depolarizing trace and 0.1 to each hyperpolarizing trace.
    protocol_weights:
      depolarizing_step: 0.8
      hyperpolarizing_pulse: 0.2

output:
  run_name: auto
