extends: ../optimizers/adam_backtracking.yaml
# Detailed reference: configs/losses/README_LSU_1.md

# Simulate depolarizing records through 500 ms after stimulus offset. The
# hyperpolarizing offset is at trace-local 550 ms, so its 100-ms override ends
# both selected hyperpolarizing records at 650 ms.
dataset:
  simulation_window:
    post_stimulus_ms: 500.0
    post_stimulus_ms_by_protocol:
      hyperpolarizing_pulse: 100.0
  score_windows:
    post_ms: 500.0

# LSU_1 uses pointwise MSE only for hyperpolarizing traces. Depolarizing traces
# use differentiable firing-rate, absolute interspike-minimum voltage,
# spike-shape/height, and recovery terms.
fit:
  objective:
    # Preserve the global 0.8/0.2 protocol allocation for protocol-specific
    # components instead of converting each component to a conditional mean.
    renormalize_protocol_filtered_components: false

    penalties:
      # Depolarizing spikes are allowed only during the current step.
      - kind: soft_outside_stimulus_spike_multiplier
        label: depolarizing_outside_step_spikes
        factor_per_spike: 1.1
        maximum_multiplier: 1.0e12
        protocols: [depolarizing_step]
        window: outside_stimulus
        threshold_mV: -20.0
        temperature_mV: 2.0

      # Hyperpolarizing traces must remain spike-free for their full duration.
      - kind: soft_outside_stimulus_spike_multiplier
        label: hyperpolarizing_any_spikes
        factor_per_spike: 1.1
        maximum_multiplier: 1.0e12
        protocols: [hyperpolarizing_pulse]
        window: full_trace
        threshold_mV: -20.0
        temperature_mV: 2.0

    components:
      # Point-by-point voltage difference only for hyperpolarizing traces.
      - kind: voltage_mse
        label: hyperpolarizing_waveform_mse
        weight: 1.0
        protocols: [hyperpolarizing_pulse]
        window: score
        scale_mV: 1.0

      # Smooth firing-frequency comparison during the depolarizing current step.
      - kind: soft_firing_rate_error
        label: depolarizing_firing_rate
        weight: 1.0
        protocols: [depolarizing_step]
        window: stimulus
        threshold_mV: -20.0
        temperature_mV: 2.0
        scale_hz: 1.0

      # Explicitly forbid depolarizing spikes before or after the current step.
      - kind: soft_forbidden_spike_count_error
        label: depolarizing_forbidden_spikes
        weight: 1.0
        protocols: [depolarizing_step]
        window: outside_stimulus
        threshold_mV: -20.0
        temperature_mV: 2.0
        scale: 1.0

      # Hyperpolarizing traces must not spike anywhere, including during pulse.
      - kind: soft_forbidden_spike_count_error
        label: hyperpolarizing_forbidden_spikes
        weight: 1.0
        protocols: [hyperpolarizing_pulse]
        window: full_trace
        threshold_mV: -20.0
        temperature_mV: 2.0
        scale: 1.0

      # Mean absolute voltage of smooth interspike minima between the first and
      # last observed spikes. Unlike DBLO, resting voltage is not subtracted.
      - kind: soft_interspike_minimum_voltage_error
        label: depolarizing_interspike_minimum_voltage
        weight: 1.0
        protocols: [depolarizing_step]
        window: stimulus
        threshold_mV: -20.0
        temperature_mV: 1.0
        scale_mV: 1.0

      # Smooth trough position, width, and asymmetry between observed spikes.
      - kind: soft_interspike_trough_shape_error
        label: depolarizing_interspike_trough_shape
        weight: 1.0
        protocols: [depolarizing_step]
        window: stimulus
        threshold_mV: -20.0
        temperature_mV: 1.0
        scale: 1.0

      # Robust waveform regularizer during the current step.
      - kind: pseudo_huber
        label: depolarizing_spike_waveform
        weight: 1.0
        protocols: [depolarizing_step]
        window: stimulus
        scale_mV: 1.0
        delta: 1.0

      # Compare every observed-aligned spike peak, not only the tallest spike.
      - kind: soft_mean_spike_peak_voltage_error
        label: depolarizing_spike_height
        weight: 1.0
        protocols: [depolarizing_step]
        window: stimulus
        threshold_mV: -20.0
        temperature_mV: 1.0
        spike_window_half_width_ms: 3.0
        scale_mV: 1.0

      # Robust full recovery waveform comparison.
      - kind: pseudo_huber
        label: depolarizing_recovery_waveform
        weight: 1.0
        protocols: [depolarizing_step]
        window: recovery
        scale_mV: 1.0
        delta: 1.0

      # AHP depth relative to each trace's own pre-step baseline.
      - kind: soft_ahp_depth_error
        label: depolarizing_ahp_depth
        weight: 1.0
        protocols: [depolarizing_step]
        window: recovery
        temperature_mV: 1.0
        scale_mV: 1.0

      # Mean below-baseline deficit across recovery: depth times duration.
      - kind: soft_ahp_deficit_error
        label: depolarizing_ahp_duration
        weight: 1.0
        protocols: [depolarizing_step]
        window: recovery
        temperature_mV: 1.0
        scale_mV: 1.0

      # Match mean(V[100:200 ms]) - mean(V[600:700 ms]).
      - kind: mean_window_difference_error
        label: depolarizing_early_late_voltage_difference
        weight: 1.0
        protocols: [depolarizing_step]
        window: full_trace
        first_window_start_ms: 100.0
        first_window_end_ms: 200.0
        second_window_start_ms: 600.0
        second_window_end_ms: 700.0
        scale_mV: 1.0

      # Confirm recovery approaches the observed baseline after hundreds of ms.
      - kind: mean_window_difference_error
        label: depolarizing_terminal_baseline_difference
        weight: 1.0
        protocols: [depolarizing_step]
        window: full_trace
        first_window_start_ms: 100.0
        first_window_end_ms: 200.0
        second_window_start_ms: 900.0
        second_window_end_ms: 1000.0
        scale_mV: 1.0

      # Pointwise comparison at stimulus samples where experimental voltage is
      # within the fixed -50 to -40 mV band.
      - kind: experimental_voltage_band_mse
        label: depolarizing_minus50_minus40_voltage_mse
        weight: 0.75
        protocols: [depolarizing_step]
        window: stimulus
        voltage_band_lower_mV: -50.0
        voltage_band_upper_mV: -40.0
        scale_mV: 1.0

    aggregation: protocol_mean
    # With two training traces per protocol, these totals assign 0.4 to each
    # depolarizing trace and 0.1 to each hyperpolarizing trace.
    protocol_weights:
      depolarizing_step: 0.7
      hyperpolarizing_pulse: 0.3

output:
  run_name: auto
