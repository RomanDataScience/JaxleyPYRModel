extends: ../optimizers/adam_backtracking.yaml
# Detailed reference: configs/losses/README_LSU_1.md

# Simulate depolarizing records through 500 ms after stimulus offset. The
# hyperpolarizing offset is at trace-local 550 ms, so its 100-ms override ends
# both selected hyperpolarizing records at 650 ms.
dataset:
  simulation_window:
    post_stimulus_ms: 500.0
    post_stimulus_ms_by_protocol:
      hyperpolarizing_pulse: 100.0
  score_windows:
    post_ms: 500.0

# LSU_1 uses only point-by-point voltage MSE between simulated and experimental
# traces, plus a continuous multiplier for spikes outside the current step.
fit:
  objective:
    # Preserve the global 0.8/0.2 protocol allocation for protocol-specific
    # components instead of converting each component to a conditional mean.
    renormalize_protocol_filtered_components: false

    penalties:
      # Count smooth upward crossings whose destination sample lies before
      # stimulus onset or after stimulus offset. Across all selected traces,
      # N outside spikes multiply the complete LSU_1 loss by 1.1**N.
      - kind: soft_outside_stimulus_spike_multiplier
        label: outside_step_spikes
        factor_per_spike: 1.1
        maximum_multiplier: 1.0e12
        protocols: [depolarizing_step, hyperpolarizing_pulse]
        threshold_mV: -20.0
        temperature_mV: 2.0

    components:
      # Mean squared point-by-point voltage difference over each score window.
      - kind: voltage_mse
        label: waveform_mse
        weight: 1.0
        protocols: [depolarizing_step, hyperpolarizing_pulse]
        window: score
        scale_mV: 5.0

    aggregation: protocol_mean
    # With two training traces per protocol, these totals assign 0.4 to each
    # depolarizing trace and 0.1 to each hyperpolarizing trace.
    protocol_weights:
      depolarizing_step: 0.8
      hyperpolarizing_pulse: 0.2

output:
  run_name: auto
