extends: LSU_1.yaml

# Expand fitted parameter bounds without changing the canonical catalog or
# other fitting presets. Zero lower bounds remain zero; positive nonzero lower
# bounds are divided by two and upper bounds are multiplied by two.
model:
  parameters:
    bound_expansion_factor: 1.0

fit:
  initialization:
    mode: jittered_reference
    # Uniform perturbation of up to +/-20% of each normalized parameter range.
    scale: 0.10
    preserve_exact_zero_reference: true

output:
  run_name: auto
