extends: ../optimizers/adam_backtracking.yaml

# Fit only the first and third hyperpolarizing records for the selected cell.
dataset:
  selection:
    trace_indices: [1, 3]
    segments: [hyperpolarizing_pulse]
  simulation_window:
    post_stimulus_ms: 100.0
  score_windows:
    # Compare 100 ms before pulse onset through 100 ms after pulse offset.
    pre_ms: 100.0
    post_ms: 100.0

fit:
  objective:
    penalties: []
    components:
      # Pure point-by-point experimental-versus-simulated voltage difference.
      - kind: voltage_mse
        label: hyperpolarizing_waveform_mse
        weight: 1.0
        protocols: [hyperpolarizing_pulse]
        window: score
        scale_mV: 1.0

      # First-derivative MSE complements voltage MSE by matching response and
      # recovery kinetics without introducing a non-differentiable feature.
      - kind: derivative_mse
        label: hyperpolarizing_derivative_mse
        weight: 1.0
        protocols: [hyperpolarizing_pulse]
        window: score
        scale_mV_per_ms: 1.0
    aggregation: protocol_mean
    protocol_weights:
      # Explicit zero overrides the inherited depolarizing allocation.
      depolarizing_step: 0.0
      hyperpolarizing_pulse: 1.0

output:
  # Resolved relative to this file: Jaxley_refactored/runs_hyper.
  root: ../../runs_hyper
  run_name: auto
