data:
  root: ../../JaxleyModel/Experimental_currentClamp_Analysis/Segmented_Traces
  cell: m20240527cd
  trace_names: [v75ctrl, v76ctrl, v77ctrl, v78ctrl]

validation:
  current_trace: v75ctrl
  expected_before_pulse_nA: 0.081246033
  expected_during_pulse_nA: 0.049997559
  current_tolerance_nA: 0.000001

parameters:
  include: []
  exclude: []

runtime:
  environment: Jaxley
  backend: jaxley
  d_lambda: 0.1
  pipeline: depolarizing_two_stage
  parallel_workers: 8
  simulation_pre_ms: 500.0
  simulation_post_ms: 600.0

plotting:
  enabled: true
  top_k: 10
  dpi: 120

# Depolarizing objective settings, shared by stage B (depol_full).
stage2:
  seeds: [0]
  generations: 10
  population_size: 8
  sigma0: 0.15
  parent_fraction: 0.5
  sigma_trajectory_mV: 2.0
  sigma_spike_mV: 2.0
  sigma_plateau_mV: 2.0
  sigma_recovery_mV: 2.0
  sigma_terminal_mV: 2.0
  sigma_firing_rate_hz: 5.0
  sigma_spike_symmetry: 0.1
  sigma_spike_height_mV: 5.0
  weights: {trajectory: 12.0, spike_shape: 10.0, spike_symmetry: 10.0, spike_height: 10.0, plateau: 24.0, return_baseline: 24.0, firing_rate: 30.0}
  threshold_mV: -20.0
  refractory_ms: 2.0
  prominence_mV: 5.0
  max_spike_width_ms: 10.0
  spike_window_ms: 5.0
  plateau_exclusion_ms: 3.0
  unmatched_spike_penalty: 100.0
  invalid_plateau_penalty: 100.0
  depolarizing_extra_spike_penalty: 10000.0
  burst_isi_fraction: 0.5
  max_isi_cv: 0.25
  require_axon_soma_count_match: true
  axon_soma_count_tolerance: 0
  return_alpha: 0.7

# Stage A: all sodium conductances fixed at 0; sodium kinetics left out of the
# fit. Scores the non-spiking parts of the recording (baseline, onset ramp,
# plateau between spikes, decay after the step); traces weighted equally.
depol_sub:
  seeds: [0]
  generations: 10
  population_size: 8
  sigma0: 0.15
  parent_fraction: 0.5
  sigma_mV: 2.0
  offset_huber_delta: 3.0
  weights: {baseline: 1.0, onset: 2.0, plateau: 4.0, recovery: 2.0}
  spike_exclusion_pre_ms: 3.0     # cut from each recorded spike's threshold...
  spike_exclusion_post_ms: 8.0    # ...to this long after its peak
  simulated_spike_penalty: 10.0

# Stage B: sodium restored, every parameter fitted with the stage2 objective,
# starting from stage A's best. Stage-A parameters are searched within
# ±local_relative_width of their stage-A value; the rest use global bounds.
depol_full:
  seeds: [0]
  generations: 10
  population_size: 8
  sigma0: 0.15
  parent_fraction: 0.5
  local_relative_width: 0.35
